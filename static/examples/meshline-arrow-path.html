<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>MeshLine Arrow Path</title>
		<style>
			body {
				margin: 0;
				overflow: hidden;
				font-family: Arial, sans-serif;
			}
			canvas {
				display: block;
			}
			#info {
				position: absolute;
				top: 10px;
				left: 10px;
				color: white;
				background: rgba(0, 0, 0, 0.7);
				padding: 15px;
				border-radius: 5px;
				font-size: 14px;
			}
		</style>
	</head>
	<body>
		<div id="info">
			<strong>MeshLine Navigation Path with Elevator</strong><br />
			Arrow texture repeating every 5 meters<br />
			Blue background color visible in transparent areas<br />
			Red spheres: path control points<br />
			Gold spheres: elevator start/end<br />
			Use mouse to orbit and zoom
		</div>
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/",
					"meshline": "https://cdn.jsdelivr.net/npm/meshline@3.3.1/dist/index.js"
				}
			}
		</script>
		<script type="module">
			import * as THREE from 'three';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { MeshLineGeometry, MeshLineMaterial } from 'meshline';

			// Custom material with conditional blending: white arrows without tinting, blue background
			class CustomBlendMeshLineMaterial extends MeshLineMaterial {
				constructor(parameters) {
					super(parameters);

					// Modify fragment shader to use conditional blending instead of multiplication
					// Original: diffuseColor *= texture2D(map, vUV * repeat);
					// New: Use texture RGB where alpha > 0, else keep material color
					this.fragmentShader = this.fragmentShader.replace(
						'if (useMap == 1.) diffuseColor *= texture2D(map, vUV * repeat);',
						`if (useMap == 1.) {
							vec4 texColor = texture2D(map, vUV * repeat);
							// Conditional blend: if texture has alpha, use texture RGB; else keep material color
							float hasTexture = step(0.01, texColor.a);
							diffuseColor.rgb = mix(diffuseColor.rgb, texColor.rgb, hasTexture);
							// Keep alpha opaque for blue background, only use texture alpha where texture exists
							diffuseColor.a = mix(diffuseColor.a, diffuseColor.a * texColor.a, hasTexture);
						}`
					);

					this.needsUpdate = true;
				}
			}

			// Scene setup
			const scene = new THREE.Scene();
			scene.background = new THREE.Color(0x1a1a2e);

			const camera = new THREE.PerspectiveCamera(
				75,
				window.innerWidth / window.innerHeight,
				0.1,
				1000
			);
			camera.position.set(0, 15, 25);

			const renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setSize(window.innerWidth, window.innerHeight);
			renderer.setPixelRatio(window.devicePixelRatio);
			document.body.appendChild(renderer.domElement);

			// Orbit controls
			const controls = new OrbitControls(camera, renderer.domElement);
			controls.enableDamping = true;
			controls.dampingFactor = 0.05;

			// Lighting
			const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
			scene.add(ambientLight);

			const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
			directionalLight.position.set(10, 20, 10);
			scene.add(directionalLight);

			// Ground plane for reference
			const groundGeometry = new THREE.PlaneGeometry(100, 100);
			const groundMaterial = new THREE.MeshStandardMaterial({
				color: 0x0f3460,
				roughness: 0.8
			});
			const ground = new THREE.Mesh(groundGeometry, groundMaterial);
			ground.rotation.x = -Math.PI / 2;
			ground.position.y = -0.1;
			scene.add(ground);

			// Grid helper
			const gridHelper = new THREE.GridHelper(100, 50, 0x16213e, 0x16213e);
			scene.add(gridHelper);

			// Create arrow texture
			function createArrowTexture() {
				const canvas = document.createElement('canvas');
				canvas.width = 512;
				canvas.height = 128;
				const ctx = canvas.getContext('2d');

				// Clear canvas to transparent (material color will show through)
				ctx.clearRect(0, 0, canvas.width, canvas.height);

				// Draw arrow in pure white (won't be tinted by material color)
				ctx.fillStyle = '#ffffff';
				ctx.strokeStyle = '#ffffff';
				ctx.lineWidth = 3;

				// Arrow shaft
				const centerY = canvas.height / 2;
				const shaftWidth = 20;
				const shaftLength = 300;

				ctx.fillRect(50, centerY - shaftWidth / 2, shaftLength, shaftWidth);
				ctx.strokeRect(50, centerY - shaftWidth / 2, shaftLength, shaftWidth);

				// Arrow head
				ctx.beginPath();
				ctx.moveTo(350, centerY);
				ctx.lineTo(300, centerY - 40);
				ctx.lineTo(300, centerY + 40);
				ctx.closePath();
				ctx.fill();
				ctx.stroke();

				const texture = new THREE.CanvasTexture(canvas);
				texture.wrapS = THREE.RepeatWrapping;
				texture.wrapT = THREE.ClampToEdgeWrapping;

				return texture;
			}

			// Create curved path with elevator segment
			// First segment: ground level approach to elevator
			const segment1Points = [
				new THREE.Vector3(-15, 0, -10),
				new THREE.Vector3(-10, 0, 0),
				new THREE.Vector3(-5, 0, 5),
				new THREE.Vector3(0, 0, 8)
			];
			const curve1 = new THREE.CatmullRomCurve3(segment1Points);
			const points1 = curve1.getPoints(80);

			// Vertical elevator segment (going up)
			const elevatorStart = new THREE.Vector3(0, 0, 8);
			const elevatorEnd = new THREE.Vector3(0, 6, 8);
			const elevatorPoints = [];
			const elevatorSteps = 40;
			for (let i = 0; i <= elevatorSteps; i++) {
				const t = i / elevatorSteps;
				elevatorPoints.push(
					new THREE.Vector3(
						elevatorStart.x,
						elevatorStart.y + (elevatorEnd.y - elevatorStart.y) * t,
						elevatorStart.z
					)
				);
			}

			// Second segment: continue on upper level
			const segment2Points = [
				new THREE.Vector3(0, 6, 8),
				new THREE.Vector3(3, 6, 8),
				new THREE.Vector3(6, 6, 6),
				new THREE.Vector3(9, 6, 2),
				new THREE.Vector3(12, 6, -2),
				new THREE.Vector3(15, 6, -8)
			];
			const curve2 = new THREE.CatmullRomCurve3(segment2Points);
			const points2 = curve2.getPoints(80);

			// Combine all points
			const allPoints = [...points1, ...elevatorPoints, ...points2];

			// Convert to flat array
			const pointsArray = [];
			allPoints.forEach((p) => {
				pointsArray.push(p.x, p.y, p.z);
			});

			// Create MeshLine geometry
			const lineGeometry = new MeshLineGeometry();
			lineGeometry.setPoints(pointsArray);

			// Create material with arrow texture and background color
			const arrowTexture = createArrowTexture();
			const lineMaterial = new CustomBlendMeshLineMaterial({
				map: arrowTexture,
				useMap: 1, // Enable texture
				repeat: new THREE.Vector2(10, 1), // Repeat texture ~10 times along path (approx every 5 meters)
				lineWidth: 0.5, // Line width in world units
				color: new THREE.Color(0x4a90e2), // Blue background color (shows where texture is transparent)
				transparent: true,
				resolution: new THREE.Vector2(window.innerWidth, window.innerHeight),
				depthTest: true
			});

			const lineMesh = new THREE.Mesh(lineGeometry, lineMaterial);
			lineMesh.position.y = 0.05; // Slightly above ground
			scene.add(lineMesh);

			// Add spheres at key points for reference
			const sphereGeometry = new THREE.SphereGeometry(0.3, 16, 16);
			const sphereMaterial = new THREE.MeshStandardMaterial({
				color: 0xff6b6b,
				emissive: 0xff0000,
				emissiveIntensity: 0.3
			});

			// Mark segment 1 points
			segment1Points.forEach((point) => {
				const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
				sphere.position.copy(point);
				scene.add(sphere);
			});

			// Mark elevator points
			const elevatorMarkerMaterial = new THREE.MeshStandardMaterial({
				color: 0xffd700,
				emissive: 0xffaa00,
				emissiveIntensity: 0.5
			});
			[elevatorStart, elevatorEnd].forEach((point) => {
				const sphere = new THREE.Mesh(sphereGeometry, elevatorMarkerMaterial);
				sphere.position.copy(point);
				scene.add(sphere);
			});

			// Mark segment 2 points
			segment2Points.forEach((point) => {
				const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
				sphere.position.copy(point);
				scene.add(sphere);
			});

			// Add elevator box visualization
			const elevatorGeometry = new THREE.BoxGeometry(2, 6, 2);
			const elevatorMaterial = new THREE.MeshStandardMaterial({
				color: 0x333333,
				transparent: true,
				opacity: 0.3,
				wireframe: true
			});
			const elevatorBox = new THREE.Mesh(elevatorGeometry, elevatorMaterial);
			elevatorBox.position.set(0, 3, 8);
			scene.add(elevatorBox);

			// Animation loop
			function animate() {
				requestAnimationFrame(animate);
				controls.update();
				renderer.render(scene, camera);
			}

			// Handle window resize
			window.addEventListener('resize', () => {
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize(window.innerWidth, window.innerHeight);
				// Update MeshLine material resolution
				lineMaterial.resolution.set(window.innerWidth, window.innerHeight);
			});

			animate();
		</script>
	</body>
</html>
